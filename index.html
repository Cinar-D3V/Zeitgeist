
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeitgeist</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #e9e5dc;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* top section */

header {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

header h1 {
    font-size: clamp(50px, 9vw, 110px);
    letter-spacing: 8px;
    color: #35271c;
}

header p {
    margin-top: 20px;
    color: #766553;
    letter-spacing: 3px;
}

/* jenga container */

.jenga-container {
    width: 100%;
    padding: 100px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 35px;
}

/* individual blocks */

.block {
    width: min(800px, 75%);
    min-height: 150px;
    background: linear-gradient(
        135deg,
        #c99b64,
        #b9824c,
        #d5a775
    );

    border: 2px solid #98683c;
    border-radius: 5px;

    box-shadow:
        0 8px 0 #98683c,
        0 12px 20px rgba(0,0,0,0.15);

    display: flex;
    justify-content: center;
    align-items: center;

    color: #382719;
    font-size: 25px;
    letter-spacing: 3px;
    font-weight: bold;

    position: relative;

    /* scroll animation */
    animation: blockAnimation linear both;
    animation-timeline: view();
    animation-range: entry 0% exit 100%;
}

/* alternate sides */

.block:nth-child(odd) {
    margin-left: -15%;
}

.block:nth-child(even) {
    margin-left: 15%;
}

/* left blocks */

.block:nth-child(odd) {
    --direction: -120vw;
}

/* right blocks */

.block:nth-child(even) {
    --direction: 120vw;
}

/* animation */

@keyframes blockAnimation {
    0% {
        transform: translateX(var(--direction)) scale(0.7);
        opacity: 0;
    }

    25% {
        transform: translateX(0) scale(1);
        opacity: 1;
    }

    65% {
        transform: translateX(0) scale(1);
        opacity: 1;
    }

    100% {
        transform: translateX(0) scale(0.3);
        opacity: 0;
    }
}

/* ending */

footer {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    color: #35271c;
}

@media (max-width: 600px) {
    .block {
        width: 80%;
        min-height: 120px;
        font-size: 18px;
    }

    .block:nth-child(odd) {
        margin-left: -5%;
    }

    .block:nth-child(even) {
        margin-left: 5%;
    }
}
</style>
</head>

<body>

<header>
    <h1>JENGA</h1>
    <p>SCROLL TO EXPLORE</p>
</header>

<main class="jenga-container">

    <div class="block">TITLE HERE</div>
    <div class="block">CONTENT HERE</div>

    <div class="block">TITLE HERE</div>
    <div class="block">CONTENT HERE</div>

    <div class="block">TITLE HERE</div>
    <div class="block">CONTENT HERE</div>

    <div class="block">TITLE HERE</div>
    <div class="block">CONTENT HERE</div>

    <div class="block">TITLE HERE</div>
    <div class="block">CONTENT HERE</div>

</main>

<footer>
    END
</footer>

</body>
</html>
